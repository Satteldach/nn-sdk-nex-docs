<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
<meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
<meta name="google" value="notranslate" />
<script type="text/javascript" src="../../template/js/jquery/jquery.js"></script>
<link href="../../template/css/template.css" rel="stylesheet" type="text/css" />
<title>ScoreBased XML Setting CSV Converter</title>

<script language="JavaScript">
<!--

// IE8は、consoleがデバッグモードでないと持っていない
if(!window.console && typeof window.console.log != 'function') {
  window.console = { log: function(msg){} };
}

function FromCSV(string, valuenames)
{
	var lines = string.split(/\r\n|\r|\n/);

	var elements = [];


	$.each(lines, function(j, line)
	{
		console.log(line);
		if(line.charAt(0) == "#")
		{
			return true; // continue
		}
		if(line == "")
		{
			return false; // break
		}

		var columns = line.split(",");
		var element = {};
		var count = 0;


		for(i = 0;i<valuenames.length;i++)
		{
			if (columns[i] != "")
			{
				element[valuenames[i]] = columns[i].replace(/\"/g, "");
				count ++;
			}
		}

		if (count != valuenames.length)
		{
			elements = [];

			var message = "Invalid CSV  Not Enough Values:" + line;
			console.log(message);
			$('#ErrorLog').html(message);

			return false; // break
		}
		elements.push(element);
	});

	return elements;
}

function ToCSV(elements, valuenames)
{
	var csvString = "#" + valuenames.join(",") + "\n";

	$.each(elements, function(j, element)
	{
		var columns = [];

		for(i=0;i<valuenames.length;i++)
		{
			columns.push(element[valuenames[i]]);
		}

		csvString += columns.join(",") + "\n";
	});

	return csvString;
}

function escapeHTML(html) {
  return jQuery('<div>').text(html).html();
}

function FromXML(value, valuenames, tagName)
{
	var elements = [];
	var xmlDoc = 0;
	try
	{
		xmlDoc = $.parseXML( value );
	} catch(e)
	{
		console.log(e);
		$('#ErrorLog').html("Error:Cannot parse this XML text.");
		return elements;
	}

	$xml = $( xmlDoc );

	$($xml).find(tagName).each(function(){
		var element = {};
		for(i = 0; i < valuenames.length; i++)
		{
			value = $(this).find(valuenames[i]).text();

			if (value != "")
			{
				element[valuenames[i]] = value;
			}
			// console.log(valuenames[i] + "," + value);
		}

		var length = 0;
		for (var i in element) {
			length++;
		}

		if (length != valuenames.length)
		{
			console.log($(this).children());
			var tags = $(this).html();
			var message = "Error:Invalid XML  Not Enough Values: expect:"+ valuenames.length +" actual:" + length +
							"<br>Expect tags:" + valuenames.join(',') + "<br>Input:" + escapeHTML(tags);
			console.log(message);
			$('#ErrorLog').html(message);

			elements = [];
			return false; // break
		}

		elements.push(element);
	});

	if (elements.length == 0)
	{
		$('#ErrorLog').html("Error:Invalid XML text");
	}


	return elements;
}

function ToXML(elements, valuenames, tagName)
{
	var csvString = "<" + tagName + "s>\n";

	$.each(elements, function(i, element)
	{
		csvString += " <" + tagName + ">\n";

		for(i=0;i<valuenames.length;i++)
		{
			csvString += "  <" + valuenames[i] + ">" + element[valuenames[i]] + "</" + valuenames[i] + ">\n";
		}

		csvString += " </" + tagName + ">\n";
	});

	csvString += "</" + tagName + "s>\n";
	return csvString;
}


scoreSettingValueNames = ["setting_index", "type", "begin", "end", "score"];

function ConvertScoreSettingsFromCSV()
{
	console.log("ScoreSettingsFromCSV");
	elements = FromCSV($("#ScoreSettingsCSV").val(), scoreSettingValueNames);
	$("#ScoreSettingsXML").val(ToXML(elements, scoreSettingValueNames, "score_setting"));
	return false;
}


function ConvertScoreSettingsFromXML()
{
	console.log("ScoreSettingsFromXML");
	elements = FromXML($("#ScoreSettingsXML").val(), scoreSettingValueNames, "score_setting");
	$("#ScoreSettingsCSV").val(ToCSV(elements, scoreSettingValueNames));

	return false;
}

rawValueMappingsValueNames = ["setting_index", "type", "begin", "end", "value"];

function ConvertRawValueMappingsFromCSV()
{
	console.log("RawValueMappingsFromCSV");
	elements = FromCSV($("#MappingSettingsCSV").val(), rawValueMappingsValueNames);
	$("#MappingSettingsXML").val(ToXML(elements, rawValueMappingsValueNames, "score_mapping"));
	return false;
}


function ConvertRawValueMappingsFromXML()
{
	console.log("RawValueMappingsFromXML");
	elements = FromXML($("#MappingSettingsXML").val(), rawValueMappingsValueNames, "score_mapping");
	$("#MappingSettingsCSV").val(ToCSV(elements, rawValueMappingsValueNames));

	return false;
}

function ConvertFromCSV()
{
	$('#ErrorLog').html("");
	if ($("#RadioScoreSettings").is(":checked"))
	{
		return ConvertScoreSettingsFromCSV();
	}

	return ConvertRawValueMappingsFromCSV();
}

function ConvertFromXML()
{
	$('#ErrorLog').html("");
	if ($("#RadioScoreSettings").is(":checked"))
	{
		return ConvertScoreSettingsFromXML();
	}

	return ConvertRawValueMappingsFromXML();
}


function TextAreaSwitch()
{
	if ($("#RadioScoreSettings").is(":checked"))
	{
		$(".ScoreSettings").css("visibility", "visible");
		$(".ScoreSettings").css("display", "inline");
		$(".MappingSettings").css("visibility", "hidden");
		$(".MappingSettings").css("display", "none");
		return true;
	}
	$(".ScoreSettings").css("visibility", "hidden");
	$(".ScoreSettings").css("display", "none");
	$(".MappingSettings").css("visibility", "visible");
	$(".MappingSettings").css("display", "inline");
	return true;
}

$(document).ready(function(){
	TextAreaSwitch();
});


//-->
</script>

</head>

<body>

<h1>ScoreBased XML Setting CSV Converter</h1>
<form name="Settings" onSubmit="false">
<input type="radio" name="mode" id="RadioScoreSettings" value="ScoreSettings" checked="checked" onClick="TextAreaSwitch();">Score Settings</input>
<input type="radio" name="mode" id="RadioRawValueMappings" value="RawValueMappings" onClick="TextAreaSwitch();">Score Mappings</input>
<br>

<div class="ScoreSettings">
CSV<br>
<textarea name="ScoreSettingsCSV" id="ScoreSettingsCSV" rows=15 cols=100>
#setting_index,type,begin,end,score
</textarea>
<br>
</div>
<div class="MappingSettings">
CSV<br>
<textarea name="MappingSettingsCSV" id="MappingSettingsCSV" rows=15 cols=100>
#setting_index,type,begin,end,value
</textarea>
<br>
</div>

<input type="button" name="ButtonCSV" value="CSV To XML" onClick="ConvertFromCSV();"><br>


<div class="ScoreSettings">
XML<br>
<textarea name="ScoreSettingsXML" id="ScoreSettingsXML" rows=20 cols=100>
</textarea>
<br>
</div>


<div class="MappingSettings">
XML<br>
<textarea name="MappingSettingsXML" id="MappingSettingsXML" rows=20 cols=100>
</textarea>
<br>
</div>


<input type="button" name="ButtonXML" value="XML To CSV" onClick="ConvertFromXML();">
<form>
<div id="ErrorLog"></div>


</body>

</html>
